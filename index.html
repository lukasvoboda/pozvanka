<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<title>Pozvánka na rande</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: one invitation card, three steps swapped in place (ask, pick a day, confirm). */
  :root {
    --bg: #f3eff6;
    --surface: #ffffff;
    --fg: #20162b;
    --muted: #6b5e7a;
    --line: #d9d0e3;
    --accent: #d81b60;
    --accent-fg: #ffffff;
    --accent-soft: #fbe3ec;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150f1f; --surface: #1f1730; --fg: #f1eaf7; --muted: #a99bbe;
      --line: #382a50; --accent: #ff5c8a; --accent-fg: #2a0a17; --accent-soft: #3a1830;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #150f1f; --surface: #1f1730; --fg: #f1eaf7; --muted: #a99bbe;
    --line: #382a50; --accent: #ff5c8a; --accent-fg: #2a0a17; --accent-soft: #3a1830;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 520px;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 24px;
  }
  .eyebrow {
    margin: 0 0 18px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .eyebrow b { color: var(--accent); font-weight: 600; }
  h1, h2 {
    font-family: var(--font-display);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  h1 { font-size: clamp(34px, 9vw, 46px); }
  h2 { font-size: clamp(28px, 7.5vw, 36px); }
  .lead { margin: 0 0 26px; color: var(--muted); }

  .actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; min-height: 56px; }
  .btn {
    font: inherit;
    font-weight: 600;
    border-radius: 14px;
    border: 1.5px solid transparent;
    padding: 14px 28px;
    cursor: pointer;
    min-height: 52px;
  }
  .btn:focus-visible, .day:focus-visible, .nav:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-yes {
    background: var(--accent);
    color: var(--accent-fg);
    font-family: var(--font-display);
    font-size: 22px;
    padding-inline: 44px;
    transform-origin: left center;
    transition: transform 0.25s ease;
  }
  .btn-no {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    transition: left 0.22s ease, top 0.22s ease;
    touch-action: none;
  }
  .btn-no.is-fleeing { position: fixed; z-index: 50; }
  .taunt { min-height: 1.5em; margin: 16px 0 0; font-size: 15px; color: var(--muted); }

  .grid-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .month { font-weight: 600; text-transform: capitalize; }
  .nav {
    font: inherit; width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer;
  }
  .nav:disabled { opacity: 0.35; cursor: default; }
  .dow, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow span {
    text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); padding-bottom: 6px;
  }
  .day {
    font: inherit; font-variant-numeric: tabular-nums; aspect-ratio: 1;
    max-height: 56px; width: 100%; border-radius: 12px; border: 1px solid transparent;
    background: transparent; color: var(--fg); cursor: pointer; padding: 0;
  }
  .day:disabled { color: var(--line); cursor: default; }
  .day:not(:disabled) { background: var(--accent-soft); }
  .day:not(:disabled):hover { border-color: var(--accent); }
  .day[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .day.is-blank { visibility: hidden; }

  .time-row {
    display: flex; align-items: baseline; gap: 12px; margin: 18px 0 16px;
    padding-top: 14px; border-top: 1px dashed var(--line);
  }
  .time-row .big { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .time-row .small { color: var(--muted); font-size: 14px; }
  .btn-confirm { background: var(--accent); color: var(--accent-fg); width: 100%; }
  .btn-confirm:disabled { background: var(--line); color: var(--muted); cursor: default; }

  .when {
    margin: 0 0 20px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft);
    font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2;
  }
  .when span { display: block; font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .sub { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: block; text-align: center; text-decoration: none; font-weight: 600;
    padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--line); color: var(--fg); background: transparent;
  }
  .link:hover { border-color: var(--accent); }
  .link.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .field label { font-size: 14px; color: var(--muted); }
  .field input {
    font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--fg); min-width: 0; width: 100%;
  }
  .mailbox { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .mailbox code { font-family: var(--font-body); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .mini {
    font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: transparent; color: var(--fg); cursor: pointer;
  }
  .note { font-size: 14px; color: var(--muted); margin: 12px 0 0; }

  .closing { margin: 22px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  button.link { font: inherit; font-weight: 600; width: 100%; cursor: pointer; }
  .back {
    font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); background: transparent;
    border: 0; padding: 6px 0; margin: 0 0 8px; cursor: pointer;
  }
  .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .btn-no, .btn-yes { transition: none; }
  }
</style>

</head>
<body>
<main class="card">
  <p class="eyebrow"><span>Pozvánka</span><b>RSVP</b></p>

  <section id="step1">
    <h1>Adélo, půjdeš se mnou na rande?</h1>
    <p class="lead">Začátek je vždycky ve 20:00. Den si vybereš v dalším kroku.</p>
    <div class="actions" id="actions">
      <button type="button" class="btn btn-yes" id="yes">Ano</button>
      <button type="button" class="btn btn-no" id="no">Ne</button>
    </div>
    <p class="taunt" id="taunt" aria-live="polite"></p>
  </section>

  <section id="step2" hidden>
    <button type="button" class="back" id="back2">&larr; Zpět</button>
    <h2>Super. Který den ti vyhovuje?</h2>
    <div class="grid-head">
      <button type="button" class="nav" id="prev" aria-label="Předchozí měsíc">&larr;</button>
      <span class="month" id="month"></span>
      <button type="button" class="nav" id="next" aria-label="Další měsíc">&rarr;</button>
    </div>
    <div class="dow" aria-hidden="true"><span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span></div>
    <div class="days" id="days"></div>
    <div class="time-row"><span class="big">20:00</span><span class="small">Čas je pevně daný. Vybrat jde jen den.</span></div>
    <button type="button" class="btn btn-confirm" id="confirm" disabled>Vyber den</button>
  </section>

  <section id="step3" hidden>
    <button type="button" class="back" id="back3">&larr; Zpět</button>
    <h2>Máme termín, Adélo.</h2>
    <p class="when" id="when"></p>
    <div class="links">
      <button type="button" class="link primary" id="apple">Přidat do Apple Kalendáře</button>
    </div>
    <p class="closing">Budu se těšit.</p>
  </section>
</main>

<script>
(function () {
  var START_HOUR = 20, DURATION_H = 3, TZ = "Europe/Prague";

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };

  /* ---------- Step 1: the "Ne" button that runs away ---------- */
  var yes = $("yes"), no = $("no"), actions = $("actions"), taunt = $("taunt");
  var placeholder = null, fleeing = false, lastDodge = 0, dodges = 0;
  var ptr = { x: -999, y: -999 };
  var lines = [
    "Tohle tlačítko dnes nefunguje.",
    "Skoro. Zkus to znovu.",
    "Ono se vždycky vyhne.",
    "Ano je hned vedle.",
    "Dneska to nevyjde.",
    "Ještě jednou a bude Ano větší."
  ];

  function rect(el) { return el.getBoundingClientRect(); }

  function startFleeing() {
    if (fleeing) return;
    var r = rect(no);
    placeholder = document.createElement("span");
    placeholder.style.cssText = "display:inline-block;width:" + r.width + "px;height:" + r.height + "px";
    actions.insertBefore(placeholder, no);
    no.classList.add("is-fleeing");
    no.style.left = r.left + "px";
    no.style.top = r.top + "px";
    fleeing = true;
  }

  function overlaps(a, b, pad) {
    return !(a.right + pad < b.left || a.left - pad > b.right || a.bottom + pad < b.top || a.top - pad > b.bottom);
  }

  function dodge() {
    var now = Date.now();
    if (now - lastDodge < 140) return;
    lastDodge = now;
    startFleeing();
    var w = no.offsetWidth, h = no.offsetHeight, m = 12;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var yr = rect(yes);
    var best = null, bestDist = -1;
    for (var i = 0; i < 40; i++) {
      var x = m + Math.random() * Math.max(1, vw - w - 2 * m);
      var y = m + Math.random() * Math.max(1, vh - h - 2 * m);
      var box = { left: x, top: y, right: x + w, bottom: y + h };
      var d = Math.hypot(x + w / 2 - ptr.x, y + h / 2 - ptr.y);
      if (overlaps(box, yr, 24)) continue;
      if (d > bestDist) { bestDist = d; best = { x: x, y: y }; }
      if (d > 220) break;
    }
    if (!best) best = { x: m, y: m };
    no.style.left = best.x + "px";
    no.style.top = best.y + "px";
    dodges++;
    taunt.textContent = lines[(dodges - 1) % lines.length];
    var scale = Math.min(1.3, 1 + dodges * 0.03);
    yes.style.transform = "scale(" + scale + ")";
  }

  function updatePointer(e) { ptr.x = e.clientX; ptr.y = e.clientY; }

  document.addEventListener("pointermove", function (e) {
    updatePointer(e);
    if ($("step1").hidden) return;
    var r = rect(no);
    var d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    if (d < Math.max(r.width, r.height) / 2 + 70) dodge();
  });
  document.addEventListener("pointerdown", function (e) {
    updatePointer(e);
    if ($("step1").hidden) return;
    var r = rect(no);
    var d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    if (d < Math.max(r.width, r.height) / 2 + 50) dodge();
  });
  no.addEventListener("pointerenter", dodge);
  no.addEventListener("focus", dodge);
  no.addEventListener("touchstart", function (e) { e.preventDefault(); dodge(); }, { passive: false });
  no.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); dodge(); });
  window.addEventListener("resize", function () {
    if (!fleeing) return;
    var r = rect(no), vw = document.documentElement.clientWidth, vh = window.innerHeight;
    no.style.left = Math.max(12, Math.min(r.left, vw - r.width - 12)) + "px";
    no.style.top = Math.max(12, Math.min(r.top, vh - r.height - 12)) + "px";
  });

  /* ---------- Step 2: calendar ---------- */
  var today = new Date();
  var tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  var first = tomorrow;
  var last = new Date(first.getFullYear(), first.getMonth(), first.getDate() + 30);
  var view = new Date(first.getFullYear(), first.getMonth(), 1);
  var selected = null;

  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

  function fmtLong(d) {
    try {
      return d.toLocaleDateString("cs-CZ", { weekday: "long", day: "numeric", month: "long" });
    } catch (e) { return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); }
  }
  function fmtShort(d) {
    try {
      return d.toLocaleDateString("cs-CZ", { weekday: "short", day: "numeric", month: "long" });
    } catch (e) { return fmtLong(d); }
  }

  function renderCalendar() {
    var y = view.getFullYear(), mo = view.getMonth();
    try {
      $("month").textContent = view.toLocaleDateString("cs-CZ", { month: "long", year: "numeric" });
    } catch (e) { $("month").textContent = pad(mo + 1) + "/" + y; }
    var box = $("days");
    box.textContent = "";
    var offset = (new Date(y, mo, 1).getDay() + 6) % 7;
    var count = new Date(y, mo + 1, 0).getDate();
    for (var i = 0; i < offset; i++) {
      var blank = document.createElement("button");
      blank.type = "button"; blank.className = "day is-blank"; blank.disabled = true; blank.tabIndex = -1;
      box.appendChild(blank);
    }
    for (var d = 1; d <= count; d++) {
      var date = new Date(y, mo, d);
      var b = document.createElement("button");
      b.type = "button"; b.className = "day"; b.textContent = d;
      var ok = date >= first && date <= last;
      b.disabled = !ok;
      if (ok) {
        b.setAttribute("aria-label", fmtLong(date));
        b.setAttribute("aria-pressed", selected && sameDay(selected, date) ? "true" : "false");
        (function (dt) {
          b.addEventListener("click", function () { selected = dt; renderCalendar(); updateConfirm(); });
        })(date);
      }
      box.appendChild(b);
    }
    $("prev").disabled = view <= new Date(first.getFullYear(), first.getMonth(), 1);
    $("next").disabled = view >= new Date(last.getFullYear(), last.getMonth(), 1);
  }

  function updateConfirm() {
    var c = $("confirm");
    c.disabled = !selected;
    c.textContent = selected ? "Potvrdit: " + fmtShort(selected) + ", " + START_HOUR + ":00" : "Vyber den";
  }

  $("prev").addEventListener("click", function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCalendar(); });
  $("next").addEventListener("click", function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCalendar(); });

  yes.addEventListener("click", function () {
    $("step1").hidden = true;
    no.hidden = true;
    if (placeholder) placeholder.remove();
    $("step2").hidden = false;
    renderCalendar();
    updateConfirm();
    window.scrollTo(0, 0);
  });

  /* ---------- Step 3: confirmation, ntfy notification, .ics file ---------- */
  var NTFY_URL = "https://ntfy.sh/ADELA_1";

  function icsText(d) {
    var ds = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    return [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Pozvanka//CS", "CALSCALE:GREGORIAN",
      "BEGIN:VTIMEZONE", "TZID:Europe/Prague",
      "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
      "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
      "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
      "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
      "END:VTIMEZONE",
      "BEGIN:VEVENT", "UID:rande-" + ds + "@pozvanka", "DTSTAMP:" + stampNow(),
      "DTSTART;TZID=Europe/Prague:" + ds + "T" + pad(START_HOUR) + "0000",
      "DTEND;TZID=Europe/Prague:" + ds + "T" + pad(START_HOUR + DURATION_H) + "0000",
      "SUMMARY:Rande",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Rande dnes ve 20:00", "TRIGGER:-PT2H", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"
    ].join("\r\n") + "\r\n";
  }
  function stampNow() {
    var n = new Date();
    return n.getUTCFullYear() + pad(n.getUTCMonth() + 1) + pad(n.getUTCDate()) + "T" +
      pad(n.getUTCHours()) + pad(n.getUTCMinutes()) + pad(n.getUTCSeconds()) + "Z";
  }

  function notify(text) {
    try {
      fetch(NTFY_URL, { method: "POST", body: text, headers: { "Title": "Rande", "Tags": "heart" } }).catch(function () {});
    } catch (e) {}
  }

  $("confirm").addEventListener("click", function () {
    if (!selected) return;
    $("step2").hidden = true;
    $("step3").hidden = false;
    var w = $("when");
    w.textContent = fmtLong(selected).replace(/^./, function (c) { return c.toUpperCase(); }) + ", " + START_HOUR + ":00";
    var sp = document.createElement("span");
    sp.textContent = "Začátek ve " + START_HOUR + ":00, pražský čas";
    w.appendChild(sp);
    notify("Adéla potvrdila: " + fmtLong(selected) + ", " + START_HOUR + ":00");
    window.scrollTo(0, 0);
  });

  $("apple").addEventListener("click", function () {
    if (!selected) return;
    var blob = new Blob([icsText(selected)], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "rande.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });

  /* ---------- Back buttons ---------- */
  $("back3").addEventListener("click", function () {
    $("step3").hidden = true;
    $("step2").hidden = false;
    window.scrollTo(0, 0);
  });
  $("back2").addEventListener("click", function () {
    $("step2").hidden = true;
    no.classList.remove("is-fleeing");
    no.style.left = ""; no.style.top = "";
    no.hidden = false;
    actions.appendChild(no);
    fleeing = false; dodges = 0; placeholder = null;
    yes.style.transform = "";
    taunt.textContent = "";
    $("step1").hidden = false;
    window.scrollTo(0, 0);
  });
})();
</script>

</body>
</html>
